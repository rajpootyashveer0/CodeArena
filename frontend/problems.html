<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Problems — CodeArena</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background:
                radial-gradient(
                    circle at 15% 0%,
                    rgba(255, 161, 22, 0.055),
                    transparent 28%
                ),
                #0b0b0b;
            color: #fff;
            font-family: "Inter", sans-serif;
        }

        /* =========================
           NAVBAR
        ========================= */

        .problems-nav {
            height: 64px;
            background: rgba(17, 17, 17, 0.96);
            border-bottom: 1px solid #292929;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 6%;

            position: sticky;
            top: 0;
            z-index: 100;

            backdrop-filter: blur(12px);
        }

        .nav-logo {
            text-decoration: none;
            color: #ffa116;

            font-family: "Space Grotesk", sans-serif;
            font-size: 23px;
            font-weight: 700;

            letter-spacing: -0.5px;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .nav-links a {
            color: #888;
            text-decoration: none;

            font-size: 13px;
            font-weight: 500;

            transition: 0.2s;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: #ffa116;
        }

        .dashboard-btn {
            text-decoration: none;

            color: #ddd;

            border: 1px solid #333;

            padding: 8px 14px;

            border-radius: 7px;

            font-size: 13px;
            font-weight: 500;

            transition: 0.2s;
        }

        .dashboard-btn:hover {
            border-color: #ffa116;
            color: #ffa116;

            background: rgba(255, 161, 22, 0.05);
        }

        /* =========================
           PAGE
        ========================= */

        .page-container {
            width: min(1200px, 92%);
            margin: 0 auto;

            padding: 48px 0 90px;
        }

        .page-heading {
            margin-bottom: 30px;
        }

        .heading-eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 7px;

            color: #ffa116;

            font-family: "JetBrains Mono", monospace;
            font-size: 11px;
            font-weight: 600;

            margin-bottom: 10px;
        }

        .heading-dot {
            width: 6px;
            height: 6px;

            background: #ffa116;

            border-radius: 50%;

            box-shadow: 0 0 10px rgba(255, 161, 22, 0.45);
        }

        .page-heading h1 {
            margin: 0 0 9px;

            font-family: "Space Grotesk", sans-serif;

            font-size: 38px;
            line-height: 1.1;

            letter-spacing: -1px;
        }

        .page-heading p {
            margin: 0;

            color: #777;

            font-size: 14px;
            line-height: 1.6;
        }

        /* =========================
           STATS
        ========================= */

        .stats-grid {
            display: grid;

            grid-template-columns:
                repeat(3, minmax(0, 1fr));

            gap: 12px;

            margin-bottom: 24px;
        }

        .stat-card {
            background: #121212;

            border: 1px solid #292929;

            border-radius: 10px;

            padding: 15px 17px;

            transition: 0.2s;
        }

        .stat-card:hover {
            border-color: #3a3a3a;
            transform: translateY(-1px);
        }

        .stat-label {
            color: #666;

            font-size: 11px;
            font-weight: 600;

            text-transform: uppercase;

            letter-spacing: 0.6px;

            margin-bottom: 7px;
        }

        .stat-value {
            color: #eee;

            font-family: "Space Grotesk", sans-serif;

            font-size: 22px;
            font-weight: 700;
        }

        .stat-value.solved {
            color: #2db55d;
        }

        .stat-value.easy {
            color: #2db55d;
        }

        .stat-value.medium {
            color: #ffa116;
        }

        .stat-value.hard {
            color: #ef4743;
        }

        /* =========================
           FILTER CARD
        ========================= */

        .controls-card {
            background: #121212;

            border: 1px solid #292929;

            border-radius: 11px;

            padding: 15px;

            margin-bottom: 18px;
        }

        .controls-top {
            display: flex;

            align-items: center;

            gap: 10px;

            margin-bottom: 13px;
        }

        .search-box {
            position: relative;

            flex: 1;
        }

        .search-icon {
            position: absolute;

            left: 13px;
            top: 50%;

            transform: translateY(-50%);

            color: #666;

            font-size: 14px;

            pointer-events: none;
        }

        .search-box input {
            width: 100%;

            height: 42px;

            background: #0d0d0d;

            border: 1px solid #303030;

            color: #fff;

            padding: 0 40px 0 36px;

            border-radius: 8px;

            outline: none;

            font-family: "Inter", sans-serif;
            font-size: 13px;

            transition: 0.2s;
        }

        .search-box input::placeholder {
            color: #555;
        }

        .search-box input:focus {
            border-color: #ffa116;

            box-shadow:
                0 0 0 3px
                rgba(255, 161, 22, 0.07);
        }

        .search-shortcut {
            position: absolute;

            right: 10px;
            top: 50%;

            transform: translateY(-50%);

            color: #555;

            border: 1px solid #292929;

            background: #151515;

            border-radius: 5px;

            padding: 3px 6px;

            font-family: "JetBrains Mono", monospace;

            font-size: 10px;
        }

        .clear-search {
            display: none;

            position: absolute;

            right: 10px;
            top: 50%;

            transform: translateY(-50%);

            border: none;

            background: transparent;

            color: #777;

            cursor: pointer;

            font-size: 15px;
        }

        .clear-search:hover {
            color: #fff;
        }

        .filter-buttons {
            display: flex;

            align-items: center;

            gap: 8px;

            flex-wrap: wrap;
        }

        .filter-btn {
            height: 34px;

            padding: 0 13px;

            border: 1px solid #303030;

            border-radius: 7px;

            background: #151515;

            color: #999;

            cursor: pointer;

            font-size: 12px;
            font-weight: 500;

            font-family: "Inter", sans-serif;

            transition: 0.2s;
        }

        .filter-btn:hover {
            color: #fff;
            border-color: #4a4a4a;
        }

        .filter-btn.active {
            background: #ffa116;

            color: #111;

            border-color: #ffa116;

            font-weight: 700;
        }

        .filter-divider {
            width: 1px;

            height: 22px;

            background: #292929;

            margin: 0 3px;
        }

        /* =========================
           LIST HEADER
        ========================= */

        .list-info {
            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 15px;

            margin: 0 2px 10px;
        }

        .result-count {
            color: #666;

            font-size: 12px;
        }

        .result-count strong {
            color: #aaa;
        }

        .active-filter-label {
            color: #777;

            font-size: 12px;
        }

        .active-filter-label span {
            color: #ffa116;

            font-weight: 600;
        }

        /* =========================
           PROBLEM TABLE
        ========================= */

        .problem-table {
            background: #151515;

            border: 1px solid #292929;

            border-radius: 12px;

            overflow: hidden;

            box-shadow:
                0 14px 40px
                rgba(0, 0, 0, 0.15);
        }

        .table-head,
        .problem-row {
            display: grid;

            grid-template-columns:
                65px
                minmax(280px, 1fr)
                140px
                130px;

            align-items: center;
        }

        .table-head {
            padding: 14px 22px;

            color: #666;

            font-size: 10px;
            font-weight: 700;

            text-transform: uppercase;

            letter-spacing: 0.7px;

            background: #111;

            border-bottom: 1px solid #292929;
        }

        .problem-row {
            min-height: 74px;

            padding: 14px 22px;

            border-bottom: 1px solid #242424;

            transition:
                background 0.18s,
                border-color 0.18s;
        }

        .problem-row:last-child {
            border-bottom: none;
        }

        .problem-row:hover {
            background: #191919;
        }

        .problem-row.solved-row {
            background:
                linear-gradient(
                    90deg,
                    rgba(45, 181, 93, 0.035),
                    transparent 55%
                );
        }

        .problem-number {
            color: #555;

            font-family: "JetBrains Mono", monospace;

            font-size: 12px;
        }

        .problem-main {
            min-width: 0;
        }

        .problem-title-line {
            display: flex;

            align-items: center;

            gap: 8px;

            min-width: 0;
        }

        .problem-title a {
            color: #eee;

            text-decoration: none;

            font-size: 14px;
            font-weight: 600;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;

            transition: 0.2s;
        }

        .problem-title a:hover {
            color: #ffa116;
        }

        .solved-check {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            width: 18px;
            height: 18px;

            flex-shrink: 0;

            border-radius: 50%;

            background: rgba(45, 181, 93, 0.12);

            color: #2db55d;

            font-size: 10px;
            font-weight: 700;
        }

        .problem-id {
            color: #555;

            font-size: 10px;

            margin-top: 5px;

            font-family: "JetBrains Mono", monospace;
        }

        /* =========================
           DIFFICULTY
        ========================= */

        .difficulty-badge {
            display: inline-flex;

            align-items: center;

            padding: 5px 9px;

            border-radius: 6px;

            font-size: 10px;

            font-weight: 700;

            text-transform: uppercase;

            letter-spacing: 0.35px;
        }

        .difficulty-easy {
            background: rgba(45, 181, 93, 0.11);

            color: #2db55d;

            border: 1px solid
                rgba(45, 181, 93, 0.13);
        }

        .difficulty-medium {
            background: rgba(255, 161, 22, 0.11);

            color: #ffa116;

            border: 1px solid
                rgba(255, 161, 22, 0.13);
        }

        .difficulty-hard {
            background: rgba(239, 71, 67, 0.11);

            color: #ef4743;

            border: 1px solid
                rgba(239, 71, 67, 0.13);
        }

        .difficulty-unknown {
            background: #1c1c1c;

            color: #777;

            border: 1px solid #292929;
        }

        /* =========================
           ACTION
        ========================= */

        .problem-action {
            text-align: right;
        }

        .solve-link {
            display: inline-flex;

            align-items: center;

            justify-content: center;

            min-width: 76px;

            color: #999;

            text-decoration: none;

            font-size: 12px;
            font-weight: 600;

            padding: 7px 9px;

            border-radius: 6px;

            transition: 0.2s;
        }

        .solve-link:hover {
            color: #ffa116;

            background:
                rgba(255, 161, 22, 0.06);
        }

        .solved-link {
            color: #2db55d !important;
        }

        .solved-link:hover {
            color: #2db55d !important;

            background:
                rgba(45, 181, 93, 0.06);
        }

        /* =========================
           EMPTY / LOADING
        ========================= */

        .loading,
        .empty-state {
            padding: 75px 20px;

            text-align: center;

            color: #666;

            font-size: 13px;
        }

        .loading::before {
            content: "";

            display: block;

            width: 22px;
            height: 22px;

            margin: 0 auto 13px;

            border: 2px solid #292929;

            border-top-color: #ffa116;

            border-radius: 50%;

            animation:
                spin 0.8s linear infinite;
        }

        .empty-icon {
            width: 44px;
            height: 44px;

            display: flex;

            align-items: center;
            justify-content: center;

            margin: 0 auto 14px;

            border-radius: 10px;

            background: #1a1a1a;

            border: 1px solid #292929;

            color: #777;

            font-size: 18px;
        }

        .empty-state strong {
            display: block;

            color: #aaa;

            font-size: 15px;

            margin-bottom: 6px;
        }

        .empty-state span {
            color: #555;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* =========================
           ERROR
        ========================= */

        .error-box {
            display: none;

            background: #291717;

            border: 1px solid #5c2525;

            color: #ff7b7b;

            border-radius: 8px;

            padding: 13px 15px;

            margin-bottom: 20px;

            font-size: 13px;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 850px) {

            .nav-links {
                display: none;
            }

            .table-head {
                display: none;
            }

            .problem-row {
                grid-template-columns:
                    40px
                    1fr
                    auto;

                gap: 10px;

                padding: 16px;
            }

            .problem-difficulty {
                grid-column: 2;
                margin-top: 7px;
            }

            .problem-action {
                grid-column: 3;
                grid-row: 1 / span 2;

                text-align: right;
            }

            .stats-grid {
                grid-template-columns:
                    repeat(3, 1fr);
            }

        }

        @media (max-width: 600px) {

            .problems-nav {
                padding: 0 20px;
            }

            .dashboard-btn {
                display: none;
            }

            .page-container {
                width: 94%;

                padding-top: 32px;
            }

            .page-heading h1 {
                font-size: 30px;
            }

            .stats-grid {
                grid-template-columns: 1fr;

                gap: 8px;
            }

            .stat-card {
                padding: 13px 15px;
            }

            .controls-card {
                padding: 11px;
            }

            .controls-top {
                margin-bottom: 10px;
            }

            .search-shortcut {
                display: none;
            }

            .filter-buttons {
                gap: 6px;
            }

            .filter-btn {
                flex: 1;

                min-width: 75px;

                padding: 0 8px;
            }

            .filter-divider {
                display: none;
            }

            .list-info {
                align-items: flex-start;

                flex-direction: column;

                gap: 4px;
            }

            .problem-row {
                padding: 15px 13px;
            }

            .problem-title a {
                font-size: 13px;
            }

            .solve-link {
                min-width: 65px;

                padding: 7px 5px;
            }

        }
    </style>
</head>

<body>

    <!-- NAVBAR -->

    <nav class="problems-nav">

        <a href="index.html" class="nav-logo">
            CodeArena
        </a>

        <div class="nav-links">

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="problems.html" class="active">
                Problems
            </a>

            <a href="profile.html">
                Profile
            </a>

        </div>

        <a href="dashboard.html" class="dashboard-btn">
            Dashboard
        </a>

    </nav>


    <!-- PAGE -->

    <main class="page-container">

        <section class="page-heading">

            <div class="heading-eyebrow">
                <span class="heading-dot"></span>
                CODING ARENA
            </div>

            <h1>
                Problems
            </h1>

            <p>
                Sharpen your problem-solving skills and master algorithms.
            </p>

        </section>


        <div id="errorBox" class="error-box"></div>


        <!-- STATS -->

        <section class="stats-grid">

            <div class="stat-card">

                <div class="stat-label">
                    Total Problems
                </div>

                <div
                    class="stat-value"
                    id="totalProblems">
                    —
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-label">
                    Solved
                </div>

                <div
                    class="stat-value solved"
                    id="totalSolved">
                    —
                </div>

            </div>


            <div class="stat-card">

                <div class="stat-label">
                    Remaining
                </div>

                <div
                    class="stat-value"
                    id="totalRemaining">
                    —
                </div>

            </div>

        </section>


        <!-- FILTER CONTROLS -->

        <section class="controls-card">

            <div class="controls-top">

                <div class="search-box">

                    <span class="search-icon">
                        ⌕
                    </span>

                    <input
                        type="text"
                        id="searchInput"
                        placeholder="Search by problem name or ID..."
                        autocomplete="off">

                    <span
                        class="search-shortcut"
                        id="searchShortcut">
                        /
                    </span>

                    <button
                        class="clear-search"
                        id="clearSearch"
                        type="button">
                        ×
                    </button>

                </div>

            </div>


            <div class="filter-buttons">

                <button
                    class="filter-btn active"
                    data-filter="all"
                    type="button">
                    All
                </button>

                <button
                    class="filter-btn"
                    data-filter="Easy"
                    type="button">
                    Easy
                </button>

                <button
                    class="filter-btn"
                    data-filter="Medium"
                    type="button">
                    Medium
                </button>

                <button
                    class="filter-btn"
                    data-filter="Hard"
                    type="button">
                    Hard
                </button>

                <div class="filter-divider"></div>

                <button
                    class="filter-btn"
                    data-filter="Solved"
                    type="button">
                    ✓ Solved
                </button>

                <button
                    class="filter-btn"
                    data-filter="Unsolved"
                    type="button">
                    Unsolved
                </button>

            </div>

        </section>


        <!-- LIST INFO -->

        <div class="list-info">

            <div
                class="result-count"
                id="resultCount">
                Loading...
            </div>

            <div
                class="active-filter-label"
                id="activeFilterLabel">
                Showing:
                <span>All</span>
            </div>

        </div>


        <!-- PROBLEM LIST -->

        <section class="problem-table">

            <div class="table-head">

                <div>
                    #
                </div>

                <div>
                    Problem
                </div>

                <div>
                    Difficulty
                </div>

                <div>
                    Action
                </div>

            </div>


            <div id="problemList">

                <div class="loading">
                    Loading problems...
                </div>

            </div>

        </section>

    </main>


    <script>

        /* =========================
           CONFIG
        ========================= */

        const API_URL =
            "http://127.0.0.1:8000";


        let allProblems = [];

        let solvedProblemIds =
            new Set();

        let activeFilter =
            "all";


        /* =========================
           ELEMENTS
        ========================= */

        const problemList =
            document.getElementById(
                "problemList"
            );

        const errorBox =
            document.getElementById(
                "errorBox"
            );

        const searchInput =
            document.getElementById(
                "searchInput"
            );

        const clearSearch =
            document.getElementById(
                "clearSearch"
            );

        const resultCount =
            document.getElementById(
                "resultCount"
            );

        const activeFilterLabel =
            document.getElementById(
                "activeFilterLabel"
            );


        /* =========================
           ESCAPE HTML
        ========================= */

        function escapeHtml(value) {

            return String(value ?? "")
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /* =========================
           LOAD PROBLEMS
        ========================= */

        async function loadProblems() {

            try {

                errorBox.style.display =
                    "none";


                const response =
                    await fetch(
                        `${API_URL}/problems`
                    );


                let data = null;


                try {

                    data =
                        await response.json();

                } catch {

                    data = null;

                }


                if (!response.ok) {

                    throw new Error(
                        data?.detail ||
                        "Unable to load problems."
                    );

                }


                if (!Array.isArray(data)) {

                    throw new Error(
                        "Invalid problems response."
                    );

                }


                allProblems = data;


                /* =========================
                   LOAD SOLVED STATUS
                ========================= */

                solvedProblemIds =
                    new Set();


                const token =
                    localStorage.getItem(
                        "access_token"
                    );


                if (token) {

                    try {

                        const submissionsResponse =
                            await fetch(
                                `${API_URL}/submissions`,
                                {
                                    method: "GET",

                                    headers: {
                                        "Authorization":
                                            `Bearer ${token}`,

                                        "Accept":
                                            "application/json"
                                    }
                                }
                            );


                        if (
                            submissionsResponse.status ===
                            401
                        ) {

                            localStorage.removeItem(
                                "access_token"
                            );

                        } else if (
                            submissionsResponse.ok
                        ) {

                            const submissions =
                                await submissionsResponse.json();


                            if (
                                Array.isArray(
                                    submissions
                                )
                            ) {

                                submissions.forEach(
                                    submission => {

                                        const status =
                                            String(
                                                submission.status ||
                                                ""
                                            )
                                                .trim()
                                                .toLowerCase();


                                        if (
                                            status ===
                                                "accepted" ||
                                            status ===
                                                "correct" ||
                                            status ===
                                                "success"
                                        ) {

                                            solvedProblemIds.add(
                                                Number(
                                                    submission.problem_id
                                                )
                                            );

                                        }

                                    }
                                );

                            }

                        }

                    } catch (error) {

                        console.warn(
                            "Unable to load solved status:",
                            error
                        );

                    }

                }


                updateStats();

                applyFilters();

            } catch (error) {

                console.error(
                    "Problems error:",
                    error
                );


                problemList.innerHTML =
                    "";


                errorBox.textContent =
                    error.message ||
                    "Unable to load problems.";


                errorBox.style.display =
                    "block";

            }

        }


        /* =========================
           UPDATE STATS
        ========================= */

        function updateStats() {

            const total =
                allProblems.length;


            const solved =
                solvedProblemIds.size;


            const remaining =
                Math.max(
                    total - solved,
                    0
                );


            document.getElementById(
                "totalProblems"
            ).textContent =
                total;


            document.getElementById(
                "totalSolved"
            ).textContent =
                solved;


            document.getElementById(
                "totalRemaining"
            ).textContent =
                remaining;

        }


        /* =========================
           FILTER LABEL
        ========================= */

        function updateFilterLabel() {

            const labels = {

                all: "All",

                Easy: "Easy",

                Medium: "Medium",

                Hard: "Hard",

                Solved: "Solved",

                Unsolved: "Unsolved"

            };


            activeFilterLabel.innerHTML =
                `Showing: <span>${escapeHtml(
                    labels[activeFilter] ||
                    "All"
                )}</span>`;

        }


        /* =========================
           APPLY FILTERS
        ========================= */

        function applyFilters() {

            const query =
                searchInput.value
                    .toLowerCase()
                    .trim();


            let filtered =
                [...allProblems];


            /* DIFFICULTY */

            if (
                activeFilter === "Easy" ||
                activeFilter === "Medium" ||
                activeFilter === "Hard"
            ) {

                filtered =
                    filtered.filter(
                        problem =>
                            String(
                                problem.difficulty ||
                                ""
                            )
                                .toLowerCase() ===
                            activeFilter.toLowerCase()
                    );

            }


            /* SOLVED */

            if (
                activeFilter ===
                "Solved"
            ) {

                filtered =
                    filtered.filter(
                        problem =>
                            solvedProblemIds.has(
                                Number(
                                    problem.id
                                )
                            )
                    );

            }


            /* UNSOLVED */

            if (
                activeFilter ===
                "Unsolved"
            ) {

                filtered =
                    filtered.filter(
                        problem =>
                            !solvedProblemIds.has(
                                Number(
                                    problem.id
                                )
                            )
                    );

            }


            /* SEARCH */

            if (query) {

                filtered =
                    filtered.filter(
                        problem => {

                            const title =
                                String(
                                    problem.title ||
                                    ""
                                )
                                    .toLowerCase();


                            const description =
                                String(
                                    problem.description ||
                                    ""
                                )
                                    .toLowerCase();


                            const id =
                                String(
                                    problem.id ||
                                    ""
                                )
                                    .toLowerCase();


                            return (
                                title.includes(
                                    query
                                ) ||
                                description.includes(
                                    query
                                ) ||
                                id.includes(
                                    query
                                )
                            );

                        }
                    );

            }


            updateFilterLabel();

            updateResultCount(
                filtered.length
            );

            updateClearButton();

            renderProblems(
                filtered
            );

        }


        /* =========================
           RESULT COUNT
        ========================= */

        function updateResultCount(
            count
        ) {

            resultCount.innerHTML =
                `
                <strong>${count}</strong>
                ${
                    count === 1
                        ? "problem"
                        : "problems"
                }
                found
                `;

        }


        /* =========================
           CLEAR SEARCH
        ========================= */

        function updateClearButton() {

            if (
                searchInput.value.trim()
            ) {

                clearSearch.style.display =
                    "block";

                document.getElementById(
                    "searchShortcut"
                ).style.display =
                    "none";

            } else {

                clearSearch.style.display =
                    "none";

                document.getElementById(
                    "searchShortcut"
                ).style.display =
                    "block";

            }

        }


        clearSearch.addEventListener(
            "click",
            () => {

                searchInput.value =
                    "";

                applyFilters();

                searchInput.focus();

            }
        );


        /* =========================
           RENDER PROBLEMS
        ========================= */

        function renderProblems(
            problems
        ) {

            if (!problems.length) {

                problemList.innerHTML = `

                    <div class="empty-state">

                        <div class="empty-icon">
                            ⌕
                        </div>

                        <strong>
                            No problems found
                        </strong>

                        <span>
                            Try changing your search
                            or filters.
                        </span>

                    </div>

                `;

                return;

            }


            problemList.innerHTML =
                problems
                    .map(
                        (problem, index) => {

                            const difficulty =
                                String(
                                    problem.difficulty ||
                                    "Unknown"
                                );


                            const difficultyLower =
                                difficulty.toLowerCase();


                            let difficultyClass =
                                "difficulty-unknown";


                            if (
                                difficultyLower ===
                                "easy"
                            ) {

                                difficultyClass =
                                    "difficulty-easy";

                            }


                            if (
                                difficultyLower ===
                                "medium"
                            ) {

                                difficultyClass =
                                    "difficulty-medium";

                            }


                            if (
                                difficultyLower ===
                                "hard"
                            ) {

                                difficultyClass =
                                    "difficulty-hard";

                            }


                            const isSolved =
                                solvedProblemIds.has(
                                    Number(
                                        problem.id
                                    )
                                );


                            const rowClass =
                                isSolved
                                    ? "problem-row solved-row"
                                    : "problem-row";


                            const actionHTML =
                                isSolved

                                    ? `
                                        <a
                                            href="problem.html?id=${encodeURIComponent(
                                                problem.id
                                            )}"
                                            class="solve-link solved-link">

                                            ✓ Solved

                                        </a>
                                    `

                                    : `
                                        <a
                                            href="problem.html?id=${encodeURIComponent(
                                                problem.id
                                            )}"
                                            class="solve-link">

                                            Solve →

                                        </a>
                                    `;


                            const solvedCheck =
                                isSolved

                                    ? `
                                        <span
                                            class="solved-check"
                                            title="Solved">

                                            ✓

                                        </span>
                                    `

                                    : "";


                            return `

                                <div
                                    class="${rowClass}">

                                    <div
                                        class="problem-number">

                                        ${
                                            index + 1
                                        }

                                    </div>


                                    <div
                                        class="problem-main">

                                        <div
                                            class="problem-title-line">

                                            <div
                                                class="problem-title">

                                                <a
                                                    href="problem.html?id=${encodeURIComponent(
                                                        problem.id
                                                    )}">

                                                    ${escapeHtml(
                                                        problem.title
                                                    )}

                                                </a>

                                            </div>

                                            ${solvedCheck}

                                        </div>


                                        <div
                                            class="problem-id">

                                            Problem #${escapeHtml(
                                                problem.id
                                            )}

                                        </div>

                                    </div>


                                    <div
                                        class="problem-difficulty">

                                        <span
                                            class="difficulty-badge ${difficultyClass}">

                                            ${escapeHtml(
                                                difficulty
                                            )}

                                        </span>

                                    </div>


                                    <div
                                        class="problem-action">

                                        ${actionHTML}

                                    </div>

                                </div>

                            `;

                        }
                    )
                    .join("");

        }


        /* =========================
           SEARCH EVENT
        ========================= */

        searchInput.addEventListener(
            "input",
            applyFilters
        );


        /* =========================
           FILTER BUTTONS
        ========================= */

        document
            .querySelectorAll(
                ".filter-btn"
            )
            .forEach(
                button => {

                    button.addEventListener(
                        "click",
                        () => {

                            document
                                .querySelectorAll(
                                    ".filter-btn"
                                )
                                .forEach(
                                    btn =>
                                        btn.classList
                                            .remove(
                                                "active"
                                            )
                                );


                            button.classList.add(
                                "active"
                            );


                            activeFilter =
                                button.dataset
                                    .filter;


                            applyFilters();

                        }
                    );

                }
            );


        /* =========================
           "/" SEARCH SHORTCUT
        ========================= */

        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "/" &&
                    document.activeElement !==
                        searchInput &&
                    document.activeElement.tagName !==
                        "TEXTAREA" &&
                    document.activeElement.tagName !==
                        "INPUT"
                ) {

                    event.preventDefault();

                    searchInput.focus();

                }


                if (
                    event.key === "Escape" &&
                    document.activeElement ===
                        searchInput
                ) {

                    searchInput.value =
                        "";

                    applyFilters();

                    searchInput.blur();

                }

            }
        );


        /* =========================
           START
        ========================= */

        loadProblems();

    </script>

</body>

</html>
