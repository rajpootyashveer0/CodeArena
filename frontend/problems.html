<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Problems — CodeArena</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            background: #0b0b0b;
            color: #fff;
            margin: 0;
            font-family: "Inter", sans-serif;
        }

        /* =========================
           NAVBAR
        ========================= */

        .problems-nav {
            height: 64px;
            background: #111;
            border-bottom: 1px solid #292929;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 6%;

            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-logo {
            text-decoration: none;
            color: #ffa116;

            font-family: "Space Grotesk", sans-serif;
            font-size: 23px;
            font-weight: 700;
        }

        .nav-links {
            display: flex;
            gap: 28px;
        }

        .nav-links a {
            color: #aaa;
            text-decoration: none;
            font-size: 14px;
            transition: 0.2s;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: #ffa116;
        }

        .dashboard-btn {
            text-decoration: none;
            color: #ddd;

            border: 1px solid #333;
            padding: 8px 14px;

            border-radius: 7px;
            font-size: 13px;

            transition: 0.2s;
        }

        .dashboard-btn:hover {
            border-color: #ffa116;
            color: #ffa116;
        }


        /* =========================
           PAGE
        ========================= */

        .page-container {
            width: min(1180px, 92%);
            margin: auto;

            padding: 45px 0 80px;
        }

        .page-heading {
            margin-bottom: 28px;
        }

        .page-heading h1 {
            margin: 0 0 8px;

            font-family: "Space Grotesk", sans-serif;
            font-size: 36px;
        }

        .page-heading p {
            margin: 0;

            color: #888;
            font-size: 14px;
        }


        /* =========================
           SUMMARY
        ========================= */

        .problem-summary {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 15px;

            margin-bottom: 18px;
        }

        .problem-count {
            color: #888;
            font-size: 13px;
        }

        .problem-count strong {
            color: #ddd;
        }

        .solved-summary {
            color: #2db55d;
            font-size: 13px;
            font-weight: 600;
        }


        /* =========================
           FILTER BAR
        ========================= */

        .filter-bar {
            display: flex;
            gap: 10px;
            align-items: center;

            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 240px;
        }

        .search-box input {
            width: 100%;

            background: #151515;
            border: 1px solid #303030;

            color: #fff;

            padding: 12px 14px;

            border-radius: 8px;

            outline: none;

            font-family: "Inter", sans-serif;
            font-size: 14px;

            transition: 0.2s;
        }

        .search-box input::placeholder {
            color: #666;
        }

        .search-box input:focus {
            border-color: #ffa116;
            box-shadow: 0 0 0 3px rgba(255, 161, 22, 0.08);
        }

        .filter-btn {
            padding: 11px 15px;

            border: 1px solid #303030;
            border-radius: 8px;

            background: #151515;
            color: #aaa;

            cursor: pointer;

            font-size: 13px;
            font-family: "Inter", sans-serif;

            transition: 0.2s;
        }

        .filter-btn:hover {
            border-color: #555;
            color: #fff;
        }

        .filter-btn.active {
            background: #ffa116;
            color: #111;

            border-color: #ffa116;

            font-weight: 700;
        }


        /* =========================
           PROBLEM TABLE
        ========================= */

        .problem-table {
            background: #151515;
            border: 1px solid #292929;

            border-radius: 12px;

            overflow: hidden;
        }

        .table-head,
        .problem-row {
            display: grid;

            grid-template-columns:
                70px
                minmax(280px, 1fr)
                130px
                130px;

            align-items: center;
        }

        .table-head {
            padding: 16px 22px;

            color: #777;
            font-size: 12px;

            background: #111;

            border-bottom: 1px solid #292929;
        }

        .problem-row {
            padding: 18px 22px;

            border-bottom: 1px solid #242424;

            transition: 0.2s;
        }

        .problem-row:last-child {
            border-bottom: none;
        }

        .problem-row:hover {
            background: #191919;
        }

        .problem-number {
            color: #666;

            font-family: "JetBrains Mono", monospace;
            font-size: 12px;
        }

        .problem-title a {
            color: #eee;
            text-decoration: none;

            font-size: 14px;
            font-weight: 600;

            transition: 0.2s;
        }

        .problem-title a:hover {
            color: #ffa116;
        }

        .problem-id {
            color: #666;
            font-size: 11px;
            margin-top: 4px;
        }


        /* =========================
           DIFFICULTY
        ========================= */

        .difficulty-badge {
            display: inline-flex;

            padding: 5px 9px;

            border-radius: 6px;

            font-size: 11px;
            font-weight: 600;
        }

        .difficulty-easy {
            background: rgba(45, 181, 93, 0.12);
            color: #2db55d;
        }

        .difficulty-medium {
            background: rgba(255, 161, 22, 0.12);
            color: #ffa116;
        }

        .difficulty-hard {
            background: rgba(239, 71, 67, 0.12);
            color: #ef4743;
        }


        /* =========================
           ACTION
        ========================= */

        .solve-link {
            color: #aaa;

            text-decoration: none;

            font-size: 13px;

            transition: 0.2s;
        }

        .solve-link:hover {
            color: #ffa116;
        }

        .solved-link {
            color: #2db55d !important;
            font-weight: 600;
        }


        /* =========================
           EMPTY / LOADING
        ========================= */

        .loading,
        .empty-state {
            padding: 60px 20px;

            text-align: center;

            color: #777;
            font-size: 14px;
        }

        .empty-state strong {
            display: block;

            color: #aaa;

            font-size: 16px;

            margin-bottom: 6px;
        }


        /* =========================
           ERROR
        ========================= */

        .error-box {
            display: none;

            background: #291717;

            border: 1px solid #5c2525;

            color: #ff7b7b;

            border-radius: 8px;

            padding: 13px 15px;

            margin-bottom: 20px;

            font-size: 13px;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 850px) {

            .nav-links {
                display: none;
            }

            .table-head {
                display: none;
            }

            .problem-row {
                grid-template-columns: 42px 1fr auto;

                gap: 10px;
            }

            .problem-difficulty {
                grid-column: 2;
                margin-top: 6px;
            }

            .problem-action {
                grid-column: 3;
                grid-row: 1 / span 2;
            }

        }


        @media (max-width: 600px) {

            .page-container {
                padding-top: 30px;
            }

            .page-heading h1 {
                font-size: 29px;
            }

            .problems-nav {
                padding: 0 20px;
            }

            .dashboard-btn {
                display: none;
            }

            .problem-summary {
                align-items: flex-start;
                flex-direction: column;
            }

            .filter-bar {
                gap: 8px;
            }

            .search-box {
                min-width: 100%;
                flex-basis: 100%;
            }

            .filter-btn {
                flex: 1;
            }

            .problem-row {
                padding: 16px;
            }

        }

    </style>
</head>


<body>

    <!-- =========================
         NAVBAR
    ========================= -->

    <nav class="problems-nav">

        <a href="index.html" class="nav-logo">
            CodeArena
        </a>

        <div class="nav-links">

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="problems.html" class="active">
                Problems
            </a>

            <a href="profile.html">
                Profile
            </a>

        </div>

        <a href="dashboard.html" class="dashboard-btn">
            Dashboard
        </a>

    </nav>


    <!-- =========================
         PAGE
    ========================= -->

    <main class="page-container">

        <section class="page-heading">

            <h1>
                Problems
            </h1>

            <p>
                Sharpen your problem-solving skills and master algorithms.
            </p>

        </section>


        <div id="errorBox" class="error-box"></div>


        <!-- =========================
             SUMMARY
        ========================= -->

        <div class="problem-summary">

            <div class="problem-count" id="problemCount">
                Loading problems...
            </div>

            <div class="solved-summary" id="solvedSummary">
                0 solved
            </div>

        </div>


        <!-- =========================
             FILTERS
        ========================= -->

        <div class="filter-bar">

            <div class="search-box">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search problems..."
                    autocomplete="off"
                >

            </div>


            <button
                class="filter-btn active"
                data-filter="all">
                All
            </button>

            <button
                class="filter-btn"
                data-filter="Easy">
                Easy
            </button>

            <button
                class="filter-btn"
                data-filter="Medium">
                Medium
            </button>

            <button
                class="filter-btn"
                data-filter="Hard">
                Hard
            </button>

            <button
                class="filter-btn"
                data-filter="Solved">
                ✓ Solved
            </button>

            <button
                class="filter-btn"
                data-filter="Unsolved">
                Unsolved
            </button>

        </div>


        <!-- =========================
             PROBLEM LIST
        ========================= -->

        <section class="problem-table">

            <div class="table-head">

                <div>#</div>

                <div>Problem</div>

                <div>Difficulty</div>

                <div>Action</div>

            </div>


            <div id="problemList">

                <div class="loading">
                    Loading problems...
                </div>

            </div>

        </section>

    </main>


    <script>

        const API_URL = "http://127.0.0.1:8000";

        let allProblems = [];
        let solvedProblemIds = new Set();
        let activeFilter = "all";


        /* =========================
           ESCAPE HTML
        ========================= */

        function escapeHtml(value) {

            return String(value ?? "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        /* =========================
           LOAD PROBLEMS
        ========================= */

        async function loadProblems() {

            const problemList =
                document.getElementById("problemList");

            const errorBox =
                document.getElementById("errorBox");

            try {

                errorBox.style.display = "none";


                /* GET ALL PROBLEMS */

                const response =
                    await fetch(`${API_URL}/problems`);


                let data = null;

                try {

                    data = await response.json();

                } catch {

                    data = null;

                }


                if (!response.ok) {

                    throw new Error(
                        data?.detail ||
                        "Unable to load problems."
                    );

                }


                if (!Array.isArray(data)) {

                    throw new Error(
                        "Invalid problems response."
                    );

                }


                allProblems = data;


                /* =========================
                   GET SOLVED PROBLEMS
                ========================= */

                solvedProblemIds = new Set();

                const token =
                    localStorage.getItem("access_token");


                if (token) {

                    try {

                        const submissionsResponse =
                            await fetch(
                                `${API_URL}/submissions`,
                                {
                                    method: "GET",

                                    headers: {
                                        "Authorization":
                                            `Bearer ${token}`,

                                        "Accept":
                                            "application/json"
                                    }
                                }
                            );


                        if (submissionsResponse.status === 401) {

                            localStorage.removeItem(
                                "access_token"
                            );

                        } else if (
                            submissionsResponse.ok
                        ) {

                            const submissions =
                                await submissionsResponse.json();


                            if (Array.isArray(submissions)) {

                                submissions.forEach(
                                    submission => {

                                        if (
                                            submission.status ===
                                            "Accepted"
                                        ) {

                                            solvedProblemIds.add(
                                                Number(
                                                    submission.problem_id
                                                )
                                            );

                                        }

                                    }
                                );

                            }

                        }

                    } catch (error) {

                        console.warn(
                            "Unable to load solved status:",
                            error
                        );

                    }

                }


                updateSummary();

                applyFilters();


            } catch (error) {

                console.error(
                    "Problems error:",
                    error
                );


                problemList.innerHTML = "";


                errorBox.textContent =
                    error.message ||
                    "Unable to load problems.";


                errorBox.style.display =
                    "block";

            }

        }


        /* =========================
           UPDATE SUMMARY
        ========================= */

        function updateSummary() {

            const problemCount =
                document.getElementById(
                    "problemCount"
                );


            const solvedSummary =
                document.getElementById(
                    "solvedSummary"
                );


            const solvedCount =
                solvedProblemIds.size;


            problemCount.innerHTML = `
                <strong>${allProblems.length}</strong>
                ${allProblems.length === 1
                    ? "problem"
                    : "problems"}
            `;


            solvedSummary.textContent =
                `${solvedCount} solved`;

        }


        /* =========================
           APPLY FILTERS
        ========================= */

        function applyFilters() {

            const searchInput =
                document.getElementById(
                    "searchInput"
                );


            const query =
                searchInput.value
                    .toLowerCase()
                    .trim();


            let filtered =
                [...allProblems];


            /* DIFFICULTY / STATUS */

            if (
                activeFilter === "Easy" ||
                activeFilter === "Medium" ||
                activeFilter === "Hard"
            ) {

                filtered =
                    filtered.filter(
                        problem =>
                            String(
                                problem.difficulty || ""
                            ).toLowerCase() ===
                            activeFilter.toLowerCase()
                    );

            }


            if (activeFilter === "Solved") {

                filtered =
                    filtered.filter(
                        problem =>
                            solvedProblemIds.has(
                                Number(problem.id)
                            )
                    );

            }


            if (activeFilter === "Unsolved") {

                filtered =
                    filtered.filter(
                        problem =>
                            !solvedProblemIds.has(
                                Number(problem.id)
                            )
                    );

            }


            /* SEARCH */

            if (query) {

                filtered =
                    filtered.filter(
                        problem => {

                            const title =
                                String(
                                    problem.title || ""
                                ).toLowerCase();


                            const description =
                                String(
                                    problem.description || ""
                                ).toLowerCase();


                            const id =
                                String(
                                    problem.id || ""
                                );


                            return (
                                title.includes(query) ||
                                description.includes(query) ||
                                id.includes(query)
                            );

                        }
                    );

            }


            renderProblems(filtered);

        }


        /* =========================
           RENDER PROBLEMS
        ========================= */

        function renderProblems(problems) {

            const problemList =
                document.getElementById(
                    "problemList"
                );


            if (!problems.length) {

                problemList.innerHTML = `
                    <div class="empty-state">

                        <strong>
                            No problems found
                        </strong>

                        Try changing your search
                        or filters.

                    </div>
                `;

                return;

            }


            problemList.innerHTML =
                problems.map(
                    (problem, index) => {


                        const difficulty =
                            String(
                                problem.difficulty || "Unknown"
                            );


                        const difficultyLower =
                            difficulty.toLowerCase();


                        let difficultyClass =
                            "difficulty-easy";


                        if (
                            difficultyLower ===
                            "medium"
                        ) {

                            difficultyClass =
                                "difficulty-medium";

                        }


                        if (
                            difficultyLower ===
                            "hard"
                        ) {

                            difficultyClass =
                                "difficulty-hard";

                        }


                        const isSolved =
                            solvedProblemIds.has(
                                Number(problem.id)
                            );


                        const actionHTML =
                            isSolved
                                ? `
                                    <a
                                        href="problem.html?id=${encodeURIComponent(problem.id)}"
                                        class="solve-link solved-link">

                                        ✓ Solved

                                    </a>
                                `
                                : `
                                    <a
                                        href="problem.html?id=${encodeURIComponent(problem.id)}"
                                        class="solve-link">

                                        Solve →

                                    </a>
                                `;


                        return `
                            <div class="problem-row">

                                <div class="problem-number">
                                    ${index + 1}
                                </div>


                                <div class="problem-title">

                                    <a
                                        href="problem.html?id=${encodeURIComponent(problem.id)}">

                                        ${escapeHtml(
                                            problem.title
                                        )}

                                    </a>

                                    <div class="problem-id">

                                        Problem #${escapeHtml(
                                            problem.id
                                        )}

                                    </div>

                                </div>


                                <div class="problem-difficulty">

                                    <span
                                        class="difficulty-badge ${difficultyClass}">

                                        ${escapeHtml(
                                            difficulty
                                        )}

                                    </span>

                                </div>


                                <div class="problem-action">

                                    ${actionHTML}

                                </div>

                            </div>
                        `;

                    }
                )
                .join("");

        }


        /* =========================
           SEARCH
        ========================= */

        document
            .getElementById("searchInput")
            .addEventListener(
                "input",
                applyFilters
            );


        /* =========================
           FILTER BUTTONS
        ========================= */

        document
            .querySelectorAll(".filter-btn")
            .forEach(button => {

                button.addEventListener(
                    "click",
                    () => {

                        document
                            .querySelectorAll(
                                ".filter-btn"
                            )
                            .forEach(
                                btn =>
                                    btn.classList.remove(
                                        "active"
                                    )
                            );


                        button.classList.add(
                            "active"
                        );


                        activeFilter =
                            button.dataset.filter;


                        applyFilters();

                    }
                );

            });


        /* =========================
           START
        ========================= */

        loadProblems();

    </script>

</body>

</html>
