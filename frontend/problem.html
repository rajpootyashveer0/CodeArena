 <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Problem — CodeArena</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background:
                radial-gradient(circle at 15% 0%, rgba(255, 161, 22, 0.045), transparent 28%),
                #0b0b0b;
            color: #fff;
            font-family: "Inter", sans-serif;
        }

        /* =========================
           NAVBAR
        ========================= */

        .problem-nav {
            height: 64px;
            background: rgba(17, 17, 17, 0.96);
            border-bottom: 1px solid #292929;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 5%;

            position: sticky;
            top: 0;
            z-index: 100;

            backdrop-filter: blur(12px);
        }

        .nav-logo {
            color: #ffa116;
            text-decoration: none;

            font-family: "Space Grotesk", sans-serif;
            font-size: 23px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .back-link {
            color: #999;
            text-decoration: none;
            font-size: 13px;
            transition: 0.2s;
        }

        .back-link:hover {
            color: #ffa116;
        }

        .dashboard-link {
            color: #ddd;
            text-decoration: none;

            border: 1px solid #333;
            padding: 8px 14px;
            border-radius: 7px;

            font-size: 13px;
            transition: 0.2s;
        }

        .dashboard-link:hover {
            color: #ffa116;
            border-color: #ffa116;
            background: rgba(255, 161, 22, 0.05);
        }

        /* =========================
           MAIN LAYOUT
        ========================= */

        .coding-layout {
            width: min(1450px, 94%);
            margin: 0 auto;

            min-height: calc(100vh - 64px);

            display: grid;
            grid-template-columns: 0.95fr 1.05fr;

            gap: 18px;

            padding: 22px 0;
        }

        /* =========================
           PANELS
        ========================= */

        .panel {
            background: #151515;
            border: 1px solid #292929;
            border-radius: 11px;
            overflow: hidden;

            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.18);
        }

        .panel-header {
            min-height: 56px;

            padding: 13px 18px;

            background: #111;
            border-bottom: 1px solid #292929;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-header h2 {
            margin: 0;

            font-family: "Space Grotesk", sans-serif;
            font-size: 15px;
            font-weight: 600;
        }

        .panel-label {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .panel-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #ffa116;

            box-shadow: 0 0 10px rgba(255, 161, 22, 0.35);
        }

        /* =========================
           PROBLEM PANEL
        ========================= */

        .problem-panel {
            min-height: 700px;
        }

        .problem-content {
            padding: 27px;
            overflow-y: auto;
            max-height: calc(100vh - 145px);

            scrollbar-width: thin;
            scrollbar-color: #333 transparent;
        }

        .problem-content::-webkit-scrollbar {
            width: 7px;
        }

        .problem-content::-webkit-scrollbar-track {
            background: transparent;
        }

        .problem-content::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 20px;
        }

        .problem-title-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;

            margin-bottom: 20px;
        }

        .problem-number {
            color: #777;
            font-size: 12px;
            font-family: "JetBrains Mono", monospace;
        }

        .problem-title {
            margin: 0;

            font-family: "Space Grotesk", sans-serif;
            font-size: 29px;
            line-height: 1.2;

            letter-spacing: -0.5px;
        }

        .difficulty {
            padding: 5px 10px;
            border-radius: 6px;

            font-size: 10px;
            font-weight: 700;

            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .easy {
            background: rgba(45, 181, 93, 0.12);
            color: #2db55d;
            border: 1px solid rgba(45, 181, 93, 0.18);
        }

        .medium {
            background: rgba(255, 161, 22, 0.12);
            color: #ffa116;
            border: 1px solid rgba(255, 161, 22, 0.18);
        }

        .hard {
            background: rgba(239, 71, 67, 0.12);
            color: #ef4743;
            border: 1px solid rgba(239, 71, 67, 0.18);
        }

        .problem-description {
            color: #c7c7c7;

            font-size: 14px;
            line-height: 1.85;

            margin-bottom: 30px;
        }

        .problem-section {
            margin-bottom: 27px;
        }

        .problem-section h3 {
            margin: 0 0 10px;

            font-family: "Space Grotesk", sans-serif;
            font-size: 15px;
            font-weight: 600;

            color: #f1f1f1;
        }

        .problem-section p {
            color: #aaa;
            font-size: 13px;
            line-height: 1.75;

            margin: 0;

            white-space: pre-wrap;
        }

        .problem-code {
            background: #0c0c0c;
            border: 1px solid #292929;
            border-radius: 7px;

            padding: 14px;

            color: #ccc;

            font-family: "JetBrains Mono", monospace;
            font-size: 12px;

            white-space: pre-wrap;
        }

        .problem-divider {
            height: 1px;
            background: #242424;
            margin: 26px 0;
        }

        /* =========================
           EDITOR
        ========================= */

        .editor-panel {
            display: flex;
            flex-direction: column;
            min-height: 700px;
        }

        .editor-heading {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .editor-heading-icon {
            width: 28px;
            height: 28px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 6px;

            background: rgba(255, 161, 22, 0.09);
            color: #ffa116;

            font-family: "JetBrains Mono", monospace;
            font-size: 12px;
        }

        .language-select {
            background: #151515;
            color: #bbb;

            border: 1px solid #333;
            border-radius: 6px;

            padding: 7px 10px;

            font-family: "Inter", sans-serif;
            font-size: 12px;

            outline: none;
            cursor: pointer;
        }

        .language-select:hover,
        .language-select:focus {
            border-color: #555;
        }

        .editor-wrapper {
            flex: 1;
            min-height: 470px;

            background: #0e0e0e;

            position: relative;
        }

        .editor-topbar {
            height: 34px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 14px;

            background: #0c0c0c;
            border-bottom: 1px solid #202020;

            color: #666;
            font-size: 10px;
        }

        .editor-file {
            font-family: "JetBrains Mono", monospace;
        }

        .editor-tip {
            color: #555;
        }

        .code-editor {
            width: 100%;
            height: calc(100% - 34px);

            min-height: 436px;

            resize: none;

            border: none;
            outline: none;

            background: #0e0e0e;
            color: #e4e4e4;

            padding: 20px;

            font-family: "JetBrains Mono", monospace;
            font-size: 13px;

            line-height: 1.7;

            tab-size: 4;

            scrollbar-width: thin;
            scrollbar-color: #333 transparent;
        }

        .code-editor::selection {
            background: rgba(255, 161, 22, 0.18);
        }

        .code-editor::placeholder {
            color: #444;
        }

        .code-editor::-webkit-scrollbar {
            width: 8px;
        }

        .code-editor::-webkit-scrollbar-track {
            background: #0e0e0e;
        }

        .code-editor::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 20px;
        }

        /* =========================
           ACTION BAR
        ========================= */

        .editor-actions {
            padding: 13px 16px;

            background: #111;
            border-top: 1px solid #292929;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 12px;
        }

        #submissionStatus {
            min-width: 130px;
        }

        .submit-actions {
            display: flex;
            gap: 9px;
        }

        .run-btn,
        .submit-btn {
            border-radius: 7px;

            padding: 10px 17px;

            font-family: "Inter", sans-serif;
            font-weight: 700;

            font-size: 12px;

            cursor: pointer;

            transition: all 0.18s ease;
        }

        .run-btn {
            background: #1a1a1a;
            color: #ddd;
            border: 1px solid #333;
        }

        .run-btn:hover {
            border-color: #555;
            background: #202020;
        }

        .submit-btn {
            background: #ffa116;
            color: #111;
            border: 1px solid #ffa116;
        }

        .submit-btn:hover {
            background: #ffb13b;
            border-color: #ffb13b;
            transform: translateY(-1px);
        }

        .submit-btn:disabled,
        .run-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            transform: none;
        }

        /* =========================
           RESULT
        ========================= */

        .result-panel {
            border-top: 1px solid #292929;
            background: #111;
        }

        .result-header {
            padding: 11px 16px;

            color: #888;
            font-size: 11px;
            font-weight: 600;

            border-bottom: 1px solid #292929;

            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .result-body {
            padding: 15px 16px;

            color: #888;

            font-family: "JetBrains Mono", monospace;
            font-size: 12px;

            min-height: 52px;

            white-space: pre-wrap;

            line-height: 1.65;
        }

        .result-success {
            color: #2db55d;
        }

        .result-error {
            color: #ef4743;
        }

        .result-warning {
            color: #ffa116;
        }

        /* =========================
           LOADING
        ========================= */

        .loading {
            text-align: center;
            color: #777;

            padding: 70px 20px;

            font-size: 13px;
        }

        .loading::before {
            content: "";
            display: block;

            width: 22px;
            height: 22px;

            margin: 0 auto 14px;

            border: 2px solid #292929;
            border-top-color: #ffa116;

            border-radius: 50%;

            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* =========================
           ERROR
        ========================= */

        .error-box {
            display: none;

            background: #291717;
            border: 1px solid #5c2525;

            color: #ff7b7b;

            padding: 13px 15px;

            border-radius: 8px;

            margin: 18px 5% 0;

            font-size: 13px;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 1100px) {

            .coding-layout {
                grid-template-columns: 1fr;
            }

            .problem-content {
                max-height: none;
            }

            .editor-panel {
                min-height: 650px;
            }
        }

        @media (max-width: 600px) {

            .problem-nav {
                padding: 0 18px;
            }

            .back-link {
                display: none;
            }

            .dashboard-link {
                padding: 7px 10px;
            }

            .coding-layout {
                width: 94%;
                padding: 14px 0;
            }

            .problem-content {
                padding: 20px;
            }

            .problem-title {
                font-size: 23px;
            }

            .editor-actions {
                flex-direction: column;
                align-items: stretch;
            }

            #submissionStatus {
                min-width: 0;
            }

            .submit-actions {
                width: 100%;
            }

            .run-btn,
            .submit-btn {
                flex: 1;
            }

            .editor-tip {
                display: none;
            }
        }
    </style>

</head>

<body>

    <!-- NAVBAR -->

    <nav class="problem-nav">

        <a href="index.html" class="nav-logo">
            CodeArena
        </a>

        <a href="problems.html" class="back-link">
            ← Back to Problems
        </a>

        <a href="dashboard.html" class="dashboard-link">
            Dashboard
        </a>

    </nav>


    <div id="errorBox" class="error-box"></div>


    <!-- CODING AREA -->

    <main class="coding-layout">

        <!-- PROBLEM PANEL -->

        <section class="panel problem-panel">

            <div class="panel-header">

                <div class="panel-label">
                    <span class="panel-dot"></span>

                    <h2>
                        Problem
                    </h2>
                </div>

            </div>

            <div id="problemContent" class="problem-content">

                <div class="loading">
                    Loading problem...
                </div>

            </div>

        </section>


        <!-- EDITOR PANEL -->

        <section class="panel editor-panel">

            <div class="panel-header">

                <div class="editor-heading">

                    <div class="editor-heading-icon">
                        &lt;/&gt;
                    </div>

                    <h2>
                        Code Editor
                    </h2>

                </div>

                <select id="languageSelect" class="language-select">

                    <option value="python">
                        Python
                    </option>

                </select>

            </div>


            <div class="editor-wrapper">

                <div class="editor-topbar">

                    <span class="editor-file">
                        solution.py
                    </span>

                    <span class="editor-tip">
                        Tab = 4 spaces
                    </span>

                </div>

                <textarea
                    id="codeEditor"
                    class="code-editor"
                    spellcheck="false"
                    placeholder="# Write your Python solution here..."
                ></textarea>

            </div>


            <div class="editor-actions">

                <div id="submissionStatus">

                    <span style="color:#777;font-size:12px;">
                        Ready
                    </span>

                </div>

                <div class="submit-actions">

                    <button
                        type="button"
                        class="run-btn"
                        id="runBtn">
                        Run
                    </button>

                    <button
                        type="button"
                        class="submit-btn"
                        id="submitBtn">
                        Submit
                    </button>

                </div>

            </div>


            <div class="result-panel">

                <div class="result-header">
                    Result
                </div>

                <div
                    id="resultBody"
                    class="result-body">
                    Ready to submit
                </div>

            </div>

        </section>

    </main>


    <script>

        console.log("CODEARENA PROBLEM PAGE LOADED");


        /* =========================
           CONFIG
        ========================= */

        const API_URL = "http://127.0.0.1:8000";

        const token =
            localStorage.getItem("access_token");

        const urlParams =
            new URLSearchParams(window.location.search);

        const problemId =
            urlParams.get("id");


        /* =========================
           ELEMENTS
        ========================= */

        const problemContent =
            document.getElementById("problemContent");

        const errorBox =
            document.getElementById("errorBox");

        const codeEditor =
            document.getElementById("codeEditor");

        const submitBtn =
            document.getElementById("submitBtn");

        const runBtn =
            document.getElementById("runBtn");

        const resultBody =
            document.getElementById("resultBody");

        const languageSelect =
            document.getElementById("languageSelect");

        const submissionStatus =
            document.getElementById("submissionStatus");


        /* =========================
           AUTH
        ========================= */

        if (!token) {

            window.location.replace("login.html");

        }


        /* =========================
           ERROR HELPER
        ========================= */

        function showError(message) {

            errorBox.textContent =
                message || "Something went wrong.";

            errorBox.style.display =
                "block";
        }


        function hideError() {

            errorBox.textContent = "";

            errorBox.style.display =
                "none";
        }


        /* =========================
           RESULT HELPER
        ========================= */

        function setResult(message, type = "") {

            resultBody.className =
                "result-body";

            if (type) {
                resultBody.classList.add(type);
            }

            resultBody.textContent =
                message;
        }


        /* =========================
           PROBLEM ID
        ========================= */

        if (!problemId) {

            showError(
                "No problem selected."
            );

            problemContent.innerHTML = "";

        }


        /* =========================
           LOAD PROBLEM
        ========================= */

        async function loadProblem() {

            if (!problemId) {
                return;
            }

            try {

                const response = await fetch(
                    `${API_URL}/problems/${problemId}`,
                    {
                        method: "GET",
                        headers: {
                            "Accept": "application/json"
                        }
                    }
                );


                let problem;

                try {
                    problem = await response.json();
                } catch {
                    problem = null;
                }


                if (!response.ok) {

                    throw new Error(
                        problem?.detail ||
                        "Unable to load problem."
                    );

                }


                let difficultyClass =
                    "easy";


                if (
                    String(problem.difficulty)
                        .toLowerCase() === "medium"
                ) {

                    difficultyClass =
                        "medium";

                }


                if (
                    String(problem.difficulty)
                        .toLowerCase() === "hard"
                ) {

                    difficultyClass =
                        "hard";

                }


                problemContent.innerHTML = `

                    <div class="problem-title-row">

                        <span class="problem-number">
                            #${escapeHtml(problem.id)}
                        </span>

                        <h1 class="problem-title">
                            ${escapeHtml(problem.title)}
                        </h1>

                        <span class="difficulty ${difficultyClass}">
                            ${escapeHtml(problem.difficulty)}
                        </span>

                    </div>


                    <div class="problem-description">
                        ${escapeHtml(problem.description)}
                    </div>


                    <div class="problem-divider"></div>


                    <div class="problem-section">

                        <h3>
                            Input Format
                        </h3>

                        <p>
                            ${escapeHtml(
                                problem.input_format ||
                                "Not specified."
                            )}
                        </p>

                    </div>


                    <div class="problem-section">

                        <h3>
                            Output Format
                        </h3>

                        <p>
                            ${escapeHtml(
                                problem.output_format ||
                                "Not specified."
                            )}
                        </p>

                    </div>


                    <div class="problem-section">

                        <h3>
                            Constraints
                        </h3>

                        <p>
                            ${escapeHtml(
                                problem.constraints ||
                                "Not specified."
                            )}
                        </p>

                    </div>

                `;

            } catch (error) {

                console.error(
                    "PROBLEM LOAD ERROR:",
                    error
                );

                problemContent.innerHTML = "";

                showError(
                    error.message
                );
            }
        }


        /* =========================
           SUBMIT
        ========================= */

        async function submitCode() {

            console.log(
                "SUBMIT BUTTON CLICKED"
            );


            const code =
                codeEditor.value.trim();


            if (!code) {

                setResult(
                    "Write some code before submitting.",
                    "result-warning"
                );

                return;
            }


            if (!problemId) {

                setResult(
                    "Invalid problem.",
                    "result-error"
                );

                return;
            }


            /*
             * Disable both buttons so the user cannot
             * accidentally send duplicate submissions.
             */

            submitBtn.disabled = true;
            runBtn.disabled = true;

            submitBtn.textContent =
                "Submitting...";


            submissionStatus.innerHTML = `
                <span style="color:#ffa116;font-size:12px;">
                    Judging...
                </span>
            `;


            setResult(
                "Running your solution..."
            );


            try {

                const response = await fetch(
                    `${API_URL}/submissions`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json",

                            "Authorization":
                                `Bearer ${token}`,

                            "Accept":
                                "application/json"
                        },

                        body: JSON.stringify({

                            problem_id:
                                Number(problemId),

                            code:
                                code,

                            language:
                                languageSelect.value

                        })
                    }
                );


                /*
                 * Read response safely.
                 */

                let data = null;

                try {

                    data =
                        await response.json();

                } catch {

                    data = null;

                }


                console.log(
                    "SUBMISSION RESPONSE:",
                    data
                );


                /*
                 * AUTH ERROR
                 */

                if (
                    response.status === 401
                ) {

                    localStorage.removeItem(
                        "access_token"
                    );

                    window.location.replace(
                        "login.html"
                    );

                    return;
                }


                /*
                 * BACKEND ERROR
                 */

                if (!response.ok) {

                    throw new Error(
                        data?.detail ||
                        data?.message ||
                        "Submission failed."
                    );

                }


                /*
                 * Backend decides the verdict.
                 */

                const status =
                    data?.status ??
                    data?.result ??
                    data?.verdict ??
                    data?.message ??
                    "";


                showSubmissionResult(
                    status,
                    data
                );


            } catch (error) {

                console.error(
                    "SUBMISSION ERROR:",
                    error
                );


                submissionStatus.innerHTML = `
                    <span style="color:#ef4743;font-size:12px;">
                        Submission failed
                    </span>
                `;


                setResult(
                    error.message ||
                    "Submission failed.",
                    "result-error"
                );


            } finally {

                submitBtn.disabled =
                    false;

                runBtn.disabled =
                    false;

                submitBtn.textContent =
                    "Submit";

            }
        }


        /* =========================
           SHOW SUBMISSION RESULT
        ========================= */

        function showSubmissionResult(
            status,
            data
        ) {

            const normalized =
                String(status || "")
                    .trim()
                    .toLowerCase()
                    .replace(/-/g, " ")
                    .replace(/_/g, " ");


            console.log(
                "NORMALIZED VERDICT:",
                normalized
            );


            /*
             * ACCEPTED
             */

            if (
                normalized === "accepted" ||
                normalized === "correct" ||
                normalized === "success"
            ) {

                submissionStatus.innerHTML = `
                    <span style="color:#2db55d;font-size:12px;font-weight:600;">
                        ✓ Accepted
                    </span>
                `;


                setResult(
                    "✓ Accepted — Your solution passed all test cases.",
                    "result-success"
                );


                return;
            }


            /*
             * WRONG ANSWER
             */

            if (
                normalized === "wrong answer" ||
                normalized === "wrong"
            ) {

                submissionStatus.innerHTML = `
                    <span style="color:#ef4743;font-size:12px;font-weight:600;">
                        ✕ Wrong Answer
                    </span>
                `;


                setResult(
                    "✕ Wrong Answer — Your solution did not pass all test cases.",
                    "result-error"
                );


                return;
            }


            /*
             * RUNTIME ERROR
             */

            if (
                normalized === "runtime error" ||
                normalized === "runtimeerror"
            ) {

                submissionStatus.innerHTML = `
                    <span style="color:#ef4743;font-size:12px;font-weight:600;">
                        ✕ Runtime Error
                    </span>
                `;


                setResult(
                    "✕ Runtime Error — Your code encountered an error while running.",
                    "result-error"
                );


                return;
            }


            /*
             * TIME LIMIT
             */

            if (
                normalized === "time limit exceeded" ||
                normalized === "tle"
            ) {

                submissionStatus.innerHTML = `
                    <span style="color:#ffa116;font-size:12px;font-weight:600;">
                        ⚠ Time Limit Exceeded
                    </span>
                `;


                setResult(
                    "⚠ Time Limit Exceeded — Your solution took too long.",
                    "result-warning"
                );


                return;
            }


            /*
             * COMPILATION ERROR
             */

            if (
                normalized === "compilation error" ||
                normalized === "compile error"
            ) {

                submissionStatus.innerHTML = `
                    <span style="color:#ef4743;font-size:12px;font-weight:600;">
                        ✕ Compilation Error
                    </span>
                `;


                setResult(
                    "✕ Compilation Error — Your code could not be executed.",
                    "result-error"
                );


                return;
            }


            /*
             * UNKNOWN RESPONSE
             */

            submissionStatus.innerHTML = `
                <span style="color:#ffa116;font-size:12px;">
                    Submission completed
                </span>
            `;


            if (data) {

                setResult(
                    `Result: ${status || JSON.stringify(data)}`,
                    "result-warning"
                );

            } else {

                setResult(
                    "Submission completed.",
                    "result-warning"
                );

            }
        }


        /* =========================
           RUN CODE
        ========================= */

        async function runCode() {

            const code =
                codeEditor.value.trim();


            if (!code) {

                setResult(
                    "Write some code before running.",
                    "result-warning"
                );

                return;
            }


            if (!problemId) {

                setResult(
                    "Invalid problem.",
                    "result-error"
                );

                return;
            }


            runBtn.disabled = true;
            submitBtn.disabled = true;

            runBtn.textContent =
                "Running...";


            submissionStatus.innerHTML = `
                <span style="color:#aaa;font-size:12px;">
                    Running code...
                </span>
            `;


            setResult(
                "Running your code..."
            );


            try {

                const response = await fetch(
                    `${API_URL}/run`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json",

                            "Accept":
                                "application/json"
                        },

                        body: JSON.stringify({

                            problem_id:
                                Number(problemId),

                            code:
                                code,

                            language:
                                languageSelect.value

                        })
                    }
                );


                let data = null;

                try {

                    data =
                        await response.json();

                } catch {

                    data = null;

                }


                if (!response.ok) {

                    throw new Error(
                        data?.detail ||
                        "Run failed."
                    );

                }


                console.log(
                    "RUN RESPONSE:",
                    data
                );


                if (data?.success) {

                    submissionStatus.innerHTML = `
                        <span style="color:#2db55d;font-size:12px;">
                            Run successful
                        </span>
                    `;


                    setResult(
                        `Output:\n${data.output || "(no output)"}`,
                        "result-success"
                    );

                } else {

                    submissionStatus.innerHTML = `
                        <span style="color:#ef4743;font-size:12px;">
                            Runtime Error
                        </span>
                    `;


                    setResult(
                        data?.output ||
                        data?.error ||
                        "Runtime Error",
                        "result-error"
                    );

                }


            } catch (error) {

                console.error(
                    "RUN ERROR:",
                    error
                );


                setResult(
                    error.message ||
                    "Run failed.",
                    "result-error"
                );


            } finally {

                runBtn.disabled =
                    false;

                submitBtn.disabled =
                    false;

                runBtn.textContent =
                    "Run";

            }
        }


        /* =========================
           BUTTON EVENTS
        ========================= */

        submitBtn.addEventListener(
            "click",
            function (event) {

                /*
                 * Prevent default browser action.
                 */

                event.preventDefault();
                event.stopPropagation();

                submitCode();

            }
        );


        runBtn.addEventListener(
            "click",
            function (event) {

                event.preventDefault();
                event.stopPropagation();

                runCode();

            }
        );


        /* =========================
           TAB KEY IN EDITOR
        ========================= */

        codeEditor.addEventListener(
            "keydown",
            function (event) {

                if (event.key === "Tab") {

                    event.preventDefault();

                    const start =
                        this.selectionStart;

                    const end =
                        this.selectionEnd;


                    this.value =
                        this.value.substring(
                            0,
                            start
                        ) +
                        "    " +
                        this.value.substring(
                            end
                        );


                    this.selectionStart =
                        this.selectionEnd =
                            start + 4;

                }

            }
        );


        /* =========================
           ESCAPE HTML
        ========================= */

        function escapeHtml(value) {

            return String(value)
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /* =========================
           START
        ========================= */

        loadProblem();

    </script>

</body>

</html>
