 <!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Submissions — CodeArena</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #0b0b0b;
            --surface: #151515;
            --surface-dark: #101010;
            --border: #292929;
            --border-light: #373737;

            --text: #ffffff;
            --muted: #777777;
            --muted-light: #aaaaaa;

            --orange: #ffa116;
            --orange-light: #ffb13b;

            --green: #2db55d;
            --red: #ef4743;
        }

        body {
            margin: 0;

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 50% -20%,
                    rgba(255, 161, 22, 0.08),
                    transparent 35%
                ),
                var(--bg);

            color: var(--text);

            font-family: "Inter", sans-serif;
        }


        /* =========================
           NAVBAR
        ========================= */

        .submissions-nav {
            height: 64px;

            background: rgba(17, 17, 17, 0.92);

            border-bottom: 1px solid var(--border);

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 6%;

            position: sticky;
            top: 0;

            z-index: 100;

            backdrop-filter: blur(12px);
        }


        .nav-logo {
            color: var(--orange);

            text-decoration: none;

            font-family: "Space Grotesk", sans-serif;

            font-size: 23px;
            font-weight: 700;

            letter-spacing: -0.5px;
        }


        .nav-links {
            display: flex;
            align-items: center;

            gap: 25px;
        }


        .nav-links a {
            color: #999;

            text-decoration: none;

            font-size: 13px;
            font-weight: 500;

            transition: 0.2s ease;
        }


        .nav-links a:hover,
        .nav-links a.active {
            color: var(--orange);
        }


        .logout-btn {
            background: transparent;

            border: 1px solid #333;

            color: #bbb;

            padding: 8px 14px;

            border-radius: 7px;

            cursor: pointer;

            font-family: inherit;

            transition: 0.2s ease;
        }


        .logout-btn:hover {
            color: var(--orange);

            border-color: var(--orange);

            background: rgba(255, 161, 22, 0.05);
        }


        /* =========================
           MAIN
        ========================= */

        .container {
            width: min(1180px, 92%);

            margin: 0 auto;

            padding: 48px 0 75px;
        }


        /* =========================
           HEADER
        ========================= */

        .page-header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;

            gap: 20px;

            margin-bottom: 28px;
        }


        .eyebrow {
            color: var(--orange);

            font-family: "JetBrains Mono", monospace;

            font-size: 11px;
            font-weight: 600;

            letter-spacing: 1.5px;

            text-transform: uppercase;

            margin-bottom: 8px;
        }


        .page-header h1 {
            margin: 0 0 8px;

            font-family: "Space Grotesk", sans-serif;

            font-size: 34px;

            letter-spacing: -0.8px;
        }


        .page-header p {
            margin: 0;

            color: var(--muted);

            font-size: 14px;
        }


        .submission-count {
            background: var(--surface);

            border: 1px solid var(--border);

            border-radius: 9px;

            padding: 10px 13px;

            color: var(--muted-light);

            font-family: "JetBrains Mono", monospace;

            font-size: 11px;

            white-space: nowrap;
        }


        .submission-count strong {
            color: var(--orange);

            font-size: 13px;
        }


        /* =========================
           ERROR
        ========================= */

        .error {
            display: none;

            padding: 14px 16px;

            background: #291717;

            border: 1px solid #5c2525;

            color: #ff7b7b;

            border-radius: 9px;

            margin-bottom: 20px;

            font-size: 13px;
        }


        /* =========================
           FILTERS
        ========================= */

        .toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 15px;

            margin-bottom: 16px;
        }


        .filter-buttons {
            display: flex;

            gap: 8px;

            flex-wrap: wrap;
        }


        .filter-btn {
            background: #111;

            border: 1px solid var(--border);

            color: #888;

            padding: 8px 12px;

            border-radius: 7px;

            font-family: inherit;

            font-size: 12px;

            cursor: pointer;

            transition: 0.2s ease;
        }


        .filter-btn:hover {
            border-color: #444;

            color: #ddd;
        }


        .filter-btn.active {
            color: #111;

            background: var(--orange);

            border-color: var(--orange);

            font-weight: 600;
        }


        .search-box {
            position: relative;

            width: min(270px, 100%);
        }


        .search-box input {
            width: 100%;

            background: #111;

            border: 1px solid var(--border);

            color: #ddd;

            padding: 10px 12px;

            border-radius: 7px;

            outline: none;

            font-family: inherit;

            font-size: 12px;

            transition: 0.2s ease;
        }


        .search-box input::placeholder {
            color: #555;
        }


        .search-box input:focus {
            border-color: var(--orange);
        }


        /* =========================
           PANEL
        ========================= */

        .panel {
            background: var(--surface);

            border: 1px solid var(--border);

            border-radius: 14px;

            overflow: hidden;
        }


        /* =========================
           SUBMISSION ITEM
        ========================= */

        .submission-item {

            display: grid;

            grid-template-columns:
                minmax(180px, 1.3fr)
                minmax(90px, 0.7fr)
                minmax(130px, 0.9fr)
                minmax(110px, 0.8fr)
                auto;

            align-items: center;

            gap: 20px;

            padding: 17px 22px;

            border-bottom: 1px solid #252525;

            transition: 0.2s ease;
        }


        .submission-item:last-child {
            border-bottom: none;
        }


        .submission-item:hover:not(.submission-header) {
            background: #181818;
        }


        /* =========================
           TABLE HEADER
        ========================= */

        .submission-header {
            background: #111;

            color: #666;

            font-size: 10px;

            font-weight: 600;

            text-transform: uppercase;

            letter-spacing: 0.7px;

            padding-top: 14px;
            padding-bottom: 14px;
        }


        /* =========================
           PROBLEM
        ========================= */

        .problem-info {
            display: flex;
            flex-direction: column;

            gap: 5px;

            min-width: 0;
        }


        .problem-title {
            color: #ddd;

            font-size: 13px;

            font-weight: 600;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }


        .problem-id {
            color: #666;

            font-family: "JetBrains Mono", monospace;

            font-size: 10px;
        }


        /* =========================
           LANGUAGE
        ========================= */

        .language {
            color: #aaa;

            font-family: "JetBrains Mono", monospace;

            font-size: 11px;

            text-transform: lowercase;
        }


        /* =========================
           STATUS
        ========================= */

        .status {
            display: inline-flex;

            align-items: center;

            width: fit-content;

            padding: 6px 9px;

            border-radius: 6px;

            font-size: 10px;

            font-weight: 700;

            white-space: nowrap;
        }


        .accepted {
            color: var(--green);

            background:
                rgba(45, 181, 93, 0.10);

            border:
                1px solid rgba(45, 181, 93, 0.12);
        }


        .wrong,
        .runtime {
            color: var(--red);

            background:
                rgba(239, 71, 67, 0.10);

            border:
                1px solid rgba(239, 71, 67, 0.12);
        }


        .pending {
            color: var(--orange);

            background:
                rgba(255, 161, 22, 0.10);

            border:
                1px solid rgba(255, 161, 22, 0.12);
        }


        /* =========================
           SUBMISSION ID
        ========================= */

        .submission-id {
            color: #777;

            font-family:
                "JetBrains Mono",
                monospace;

            font-size: 11px;
        }


        /* =========================
           VIEW BUTTON
        ========================= */

        .view-btn {
            background: transparent;

            border: 1px solid #333;

            color: #aaa;

            padding: 7px 11px;

            border-radius: 6px;

            cursor: pointer;

            font-family: inherit;

            font-size: 11px;

            transition: 0.2s ease;

            white-space: nowrap;
        }


        .view-btn:hover {
            color: var(--orange);

            border-color: var(--orange);

            background:
                rgba(255, 161, 22, 0.04);
        }


        /* =========================
           LOADING / EMPTY
        ========================= */

        .loading,
        .empty {
            padding: 65px 20px;

            text-align: center;

            color: #666;

            font-size: 13px;
        }


        .empty-icon {
            font-size: 28px;

            margin-bottom: 12px;

            opacity: 0.7;
        }


        .empty-title {
            color: #aaa;

            font-weight: 600;

            margin-bottom: 6px;
        }


        .empty-text {
            color: #666;

            font-size: 12px;
        }


        /* =========================
           MODAL
        ========================= */

        .modal {
            display: none;

            position: fixed;

            inset: 0;

            background:
                rgba(0, 0, 0, 0.78);

            align-items: center;
            justify-content: center;

            padding: 20px;

            z-index: 1000;

            backdrop-filter: blur(5px);
        }


        .modal.show {
            display: flex;
        }


        .modal-content {
            width: min(900px, 96%);

            max-height: 88vh;

            background: var(--surface);

            border: 1px solid #363636;

            border-radius: 14px;

            overflow: hidden;

            display: flex;

            flex-direction: column;

            box-shadow:
                0 20px 80px
                rgba(0, 0, 0, 0.5);
        }


        .modal-header {
            padding: 16px 20px;

            background: #111;

            border-bottom: 1px solid var(--border);

            display: flex;

            justify-content: space-between;

            align-items: center;
        }


        .modal-title-group {
            min-width: 0;
        }


        .modal-header h2 {
            margin: 0 0 4px;

            font-family:
                "Space Grotesk",
                sans-serif;

            font-size: 17px;
        }


        .modal-subtitle {
            color: #666;

            font-family:
                "JetBrains Mono",
                monospace;

            font-size: 10px;
        }


        .close-btn {
            width: 32px;
            height: 32px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: transparent;

            border: 1px solid #303030;

            border-radius: 7px;

            color: #888;

            font-size: 19px;

            cursor: pointer;

            transition: 0.2s;
        }


        .close-btn:hover {
            color: var(--orange);

            border-color: var(--orange);
        }


        .code-box {
            margin: 0;

            padding: 22px;

            overflow: auto;

            color: #ddd;

            background: #0d0d0d;

            font-family:
                "JetBrains Mono",
                monospace;

            font-size: 12px;

            line-height: 1.7;

            white-space: pre;

            flex: 1;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 900px) {

            .submission-header {
                display: none;
            }


            .submission-item {

                grid-template-columns:
                    minmax(0, 1fr)
                    auto;

                gap: 12px;

                padding: 16px;
            }


            .language,
            .submission-id {

                grid-column: 1;

                font-size: 10px;
            }


            .status {
                grid-column: 2;

                grid-row: 1;

                align-self: start;
            }


            .view-btn {
                grid-column: 2;

                grid-row: 2 / span 2;
            }

        }


        @media (max-width: 700px) {

            .toolbar {
                flex-direction: column;

                align-items: stretch;
            }


            .search-box {
                width: 100%;
            }

        }


        @media (max-width: 600px) {

            .submissions-nav {
                padding: 0 18px;
            }


            .nav-links {
                display: none;
            }


            .container {
                width: 92%;

                padding-top: 32px;
                padding-bottom: 55px;
            }


            .page-header {
                flex-direction: column;

                align-items: flex-start;

                gap: 15px;
            }


            .page-header h1 {
                font-size: 29px;
            }


            .filter-buttons {
                gap: 6px;
            }


            .filter-btn {
                padding: 7px 10px;

                font-size: 11px;
            }


            .submission-item {
                padding: 14px;
            }


            .modal {
                padding: 10px;
            }


            .modal-content {
                width: 100%;

                max-height: 92vh;
            }


            .modal-header {
                padding: 14px;
            }


            .code-box {
                padding: 15px;

                font-size: 11px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         NAVBAR
    ========================== -->

    <nav class="submissions-nav">

        <a
            href="index.html"
            class="nav-logo">

            CodeArena

        </a>


        <div class="nav-links">

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="problems.html">
                Problems
            </a>

            <a
                href="submissions.html"
                class="active">

                Submissions

            </a>

            <a href="profile.html">
                Profile
            </a>

        </div>


        <button
            id="logoutBtn"
            class="logout-btn">

            Logout

        </button>

    </nav>


    <!-- =========================
         MAIN
    ========================== -->

    <main class="container">


        <section class="page-header">

            <div>

                <div class="eyebrow">
                    CODEARENA / HISTORY
                </div>

                <h1>
                    Submissions
                </h1>

                <p>
                    Review your coding attempts and submission history.
                </p>

            </div>


            <div class="submission-count">

                TOTAL

                <strong id="submissionCount">
                    0
                </strong>

            </div>

        </section>


        <!-- ERROR -->

        <div
            id="errorBox"
            class="error">
        </div>


        <!-- FILTERS -->

        <section class="toolbar">


            <div class="filter-buttons">

                <button
                    class="filter-btn active"
                    data-filter="all">

                    All

                </button>


                <button
                    class="filter-btn"
                    data-filter="accepted">

                    Accepted

                </button>


                <button
                    class="filter-btn"
                    data-filter="wrong answer">

                    Wrong Answer

                </button>


                <button
                    class="filter-btn"
                    data-filter="runtime error">

                    Runtime Error

                </button>

            </div>


            <div class="search-box">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search problem or submission..."
                    autocomplete="off">

            </div>

        </section>


        <!-- SUBMISSIONS -->

        <section class="panel">


            <!-- TABLE HEADER -->

            <div class="submission-item submission-header">

                <div>
                    Problem
                </div>

                <div>
                    Language
                </div>

                <div>
                    Status
                </div>

                <div>
                    Submission
                </div>

                <div>
                    Action
                </div>

            </div>


            <div id="submissionsList">

                <div class="loading">
                    Loading submissions...
                </div>

            </div>


        </section>


    </main>


    <!-- =========================
         CODE MODAL
    ========================== -->

    <div
        id="codeModal"
        class="modal">


        <div
            class="modal-content"
            role="dialog"
            aria-modal="true"
            aria-labelledby="modalTitle">


            <div class="modal-header">


                <div class="modal-title-group">

                    <h2 id="modalTitle">
                        Submitted Code
                    </h2>

                    <div
                        id="modalSubtitle"
                        class="modal-subtitle">

                        SUBMISSION

                    </div>

                </div>


                <button
                    id="closeModal"
                    class="close-btn"
                    aria-label="Close">

                    ×

                </button>

            </div>


            <pre
                id="codeBox"
                class="code-box"></pre>


        </div>


    </div>


    <script>

        const API_URL =
            "http://127.0.0.1:8000";


        const token =
            localStorage.getItem(
                "access_token"
            );


        let allSubmissions = [];


        let currentFilter =
            "all";


        /* =========================
           AUTH
        ========================= */

        if (!token) {

            window.location.replace(
                "login.html"
            );

        }


        /* =========================
           ELEMENTS
        ========================= */

        const submissionsList =
            document.getElementById(
                "submissionsList"
            );


        const errorBox =
            document.getElementById(
                "errorBox"
            );


        const submissionCount =
            document.getElementById(
                "submissionCount"
            );


        const searchInput =
            document.getElementById(
                "searchInput"
            );


        const codeModal =
            document.getElementById(
                "codeModal"
            );


        const codeBox =
            document.getElementById(
                "codeBox"
            );


        const modalSubtitle =
            document.getElementById(
                "modalSubtitle"
            );


        const closeModal =
            document.getElementById(
                "closeModal"
            );


        /* =========================
           ESCAPE HTML
        ========================= */

        function escapeHtml(value) {

            return String(
                value ?? ""
            )

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /* =========================
           STATUS CLASS
        ========================= */

        function getStatusClass(status) {

            const normalized =
                String(
                    status || ""
                )
                    .trim()
                    .toLowerCase();


            if (
                normalized ===
                "accepted"
            ) {

                return "accepted";

            }


            if (
                normalized ===
                "wrong answer"
            ) {

                return "wrong";

            }


            if (
                normalized ===
                "runtime error"
            ) {

                return "runtime";

            }


            return "pending";

        }


        /* =========================
           SHOW ERROR
        ========================= */

        function showError(message) {

            errorBox.textContent =
                message ||
                "Something went wrong.";

            errorBox.style.display =
                "block";

        }


        /* =========================
           RENDER SUBMISSIONS
        ========================= */

        function renderSubmissions() {

            const searchTerm =
                searchInput.value
                    .trim()
                    .toLowerCase();


            const filtered =
                allSubmissions.filter(
                    submission => {

                        const status =
                            String(
                                submission.status ||
                                ""
                            )
                                .toLowerCase();


                        const problem =
                            `problem ${submission.problem_id}`;


                        const submissionText =
                            `submission ${submission.id}`;


                        const matchesFilter =
                            currentFilter ===
                            "all"
                                ? true
                                : status ===
                                currentFilter;


                        const matchesSearch =
                            !searchTerm ||

                            problem
                                .toLowerCase()
                                .includes(
                                    searchTerm
                                ) ||

                            submissionText
                                .toLowerCase()
                                .includes(
                                    searchTerm
                                ) ||

                            String(
                                submission.problem_id
                            )
                                .includes(
                                    searchTerm
                                ) ||

                            String(
                                submission.id
                            )
                                .includes(
                                    searchTerm
                                );


                        return (
                            matchesFilter &&
                            matchesSearch
                        );

                    }
                );


            if (
                filtered.length === 0
            ) {

                submissionsList.innerHTML = `

                    <div class="empty">

                        <div class="empty-icon">
                            ⌁
                        </div>

                        <div class="empty-title">
                            No submissions found
                        </div>

                        <div class="empty-text">
                            Try changing your filters or search.
                        </div>

                    </div>

                `;

                return;

            }


            submissionsList.innerHTML =
                filtered
                    .map(
                        submission => {

                            const status =
                                String(
                                    submission.status ||
                                    "Pending"
                                );


                            const statusClass =
                                getStatusClass(
                                    status
                                );


                            return `

                                <div
                                    class="submission-item"
                                >


                                    <!-- PROBLEM -->

                                    <div
                                        class="problem-info"
                                    >

                                        <div
                                            class="problem-title"
                                        >

                                            Problem #${escapeHtml(
                                                submission.problem_id
                                            )}

                                        </div>


                                        <div
                                            class="problem-id"
                                        >

                                            SUBMISSION #${escapeHtml(
                                                submission.id
                                            )}

                                        </div>

                                    </div>


                                    <!-- LANGUAGE -->

                                    <div
                                        class="language"
                                    >

                                        ${escapeHtml(
                                            submission.language ||
                                            "Unknown"
                                        )}

                                    </div>


                                    <!-- STATUS -->

                                    <div>

                                        <span
                                            class="status ${statusClass}"
                                        >

                                            ${escapeHtml(
                                                status
                                            )}

                                        </span>

                                    </div>


                                    <!-- ID -->

                                    <div
                                        class="submission-id"
                                    >

                                        #${escapeHtml(
                                            submission.id
                                        )}

                                    </div>


                                    <!-- ACTION -->

                                    <div>

                                        <button
                                            class="view-btn"
                                            data-id="${escapeHtml(
                                                submission.id
                                            )}"
                                        >

                                            View Code

                                        </button>

                                    </div>


                                </div>

                            `;

                        }
                    )
                    .join("");


            document
                .querySelectorAll(
                    ".view-btn"
                )
                .forEach(
                    button => {

                        button.addEventListener(
                            "click",
                            () => {

                                const id =
                                    button.dataset.id;


                                const submission =
                                    allSubmissions.find(
                                        item =>
                                            String(
                                                item.id
                                            ) ===
                                            String(id)
                                    );


                                if (
                                    !submission
                                ) {
                                    return;
                                }


                                openCodeModal(
                                    submission
                                );

                            }
                        );

                    }
                );

        }


        /* =========================
           OPEN MODAL
        ========================= */

        function openCodeModal(
            submission
        ) {

            codeBox.textContent =
                submission.code || "";


            modalSubtitle.textContent =
                `SUBMISSION #${submission.id} · PROBLEM #${submission.problem_id}`;


            codeModal.classList.add(
                "show"
            );

        }


        /* =========================
           CLOSE MODAL
        ========================= */

        function closeCodeModal() {

            codeModal.classList.remove(
                "show"
            );

        }


        closeModal.addEventListener(
            "click",
            closeCodeModal
        );


        codeModal.addEventListener(
            "click",
            event => {

                if (
                    event.target ===
                    codeModal
                ) {

                    closeCodeModal();

                }

            }
        );


        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "Escape"
                ) {

                    closeCodeModal();

                }

            }
        );


        /* =========================
           FILTERS
        ========================= */

        document
            .querySelectorAll(
                ".filter-btn"
            )
            .forEach(
                button => {

                    button.addEventListener(
                        "click",
                        () => {

                            document
                                .querySelectorAll(
                                    ".filter-btn"
                                )
                                .forEach(
                                    item =>
                                        item.classList.remove(
                                            "active"
                                        )
                                );


                            button.classList.add(
                                "active"
                            );


                            currentFilter =
                                button.dataset.filter;


                            renderSubmissions();

                        }
                    );

                }
            );


        /* =========================
           SEARCH
        ========================= */

        searchInput.addEventListener(
            "input",
            renderSubmissions
        );


        /* =========================
           LOAD SUBMISSIONS
        ========================= */

        async function loadSubmissions() {

            try {

                const response =
                    await fetch(
                        `${API_URL}/submissions`,
                        {
                            method:
                                "GET",

                            headers: {

                                "Authorization":
                                    `Bearer ${token}`,

                                "Accept":
                                    "application/json"

                            }
                        }
                    );


                if (
                    response.status ===
                    401
                ) {

                    localStorage.removeItem(
                        "access_token"
                    );


                    window.location.replace(
                        "login.html"
                    );


                    return;

                }


                let data;


                try {

                    data =
                        await response.json();

                } catch {

                    throw new Error(
                        "Invalid server response."
                    );

                }


                if (
                    !response.ok
                ) {

                    throw new Error(
                        data?.detail ||
                        "Unable to load submissions."
                    );

                }


                if (
                    !Array.isArray(
                        data
                    )
                ) {

                    throw new Error(
                        "Invalid submissions response."
                    );

                }


                /* LATEST FIRST */

                allSubmissions =
                    [...data].sort(
                        (a, b) =>
                            Number(
                                b.id
                            ) -
                            Number(
                                a.id
                            )
                    );


                submissionCount.textContent =
                    allSubmissions.length;


                renderSubmissions();


            } catch (error) {

                console.error(
                    "Submissions error:",
                    error
                );


                showError(
                    error.message ||
                    "Unable to load submissions."
                );


                submissionsList.innerHTML = `

                    <div class="empty">

                        <div class="empty-icon">
                            !
                        </div>

                        <div class="empty-title">
                            Unable to load submissions
                        </div>

                        <div class="empty-text">
                            Please check that the backend is running.
                        </div>

                    </div>

                `;

            }

        }


        /* =========================
           LOGOUT
        ========================= */

        document
            .getElementById(
                "logoutBtn"
            )
            .addEventListener(
                "click",
                () => {

                    localStorage.removeItem(
                        "access_token"
                    );


                    window.location.replace(
                        "login.html"
                    );

                }
            );


        /* =========================
           START
        ========================= */

        loadSubmissions();

    </script>


</body>

</html>
